name: apuracao-cd

# Publica as imagens no GHCR a cada merge na main e, se a conta AWS estiver configurada
# (variável AWS_ROLE_ARN no repositório), aplica o Terraform e publica o front-end.
on:
  push:
    branches: [main]
    paths:
      - 'apuracao-presidencial/**'
      - '.github/workflows/apuracao-cd.yml'
  workflow_dispatch:

concurrency:
  group: apuracao-cd
  cancel-in-progress: false # nunca interromper um deploy no meio

permissions:
  contents: read

jobs:
  imagens:
    name: publicar (${{ matrix.servico }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - { servico: mock-tse, contexto: services/mock-tse }
          - { servico: ingestor, contexto: services/ingestor }
          - { servico: api, contexto: services/api }
          - { servico: web, contexto: web }
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/apuracao-${{ matrix.servico }}
          tags: |
            type=sha,format=long,prefix=
            type=raw,value=latest,enable={{is_default_branch}}
      - name: Build para varredura
        uses: docker/build-push-action@v6
        with:
          context: apuracao-presidencial/${{ matrix.contexto }}
          load: true
          tags: candidata:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.servico }}
          cache-to: type=gha,mode=max,scope=${{ matrix.servico }}
      - name: Varredura de vulnerabilidades (Trivy)
        run: >-
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock aquasec/trivy:0.65.0
          image --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 --no-progress
          candidata:${{ github.sha }}
      - name: Publicar no GHCR (com SBOM e proveniência)
        uses: docker/build-push-action@v6
        with:
          context: apuracao-presidencial/${{ matrix.contexto }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha,scope=${{ matrix.servico }}

  implantar:
    needs: imagens
    if: ${{ vars.AWS_ROLE_ARN != '' }}
    runs-on: ubuntu-latest
    environment: producao # configure revisores obrigatórios nas configurações do repositório
    permissions:
      contents: read
      id-token: write # OIDC: sem chave de acesso da AWS guardada no GitHub
    env:
      AWS_REGION: ${{ vars.AWS_REGION || 'sa-east-1' }}
    defaults:
      run:
        working-directory: apuracao-presidencial
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false
      - name: Terraform apply
        working-directory: apuracao-presidencial/infra/terraform
        run: |
          terraform init -input=false \
            -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}" \
            -backend-config="key=apuracao/producao.tfstate" \
            -backend-config="region=$AWS_REGION" \
            -backend-config="encrypt=true" \
            -backend-config="use_lockfile=true"
          terraform apply -input=false -auto-approve \
            -var="regiao=$AWS_REGION" \
            -var="eleicao=${{ vars.ELEICAO }}" \
            -var="turno=${{ vars.TURNO || 1 }}" \
            -var="tag_imagem=${{ github.sha }}"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Publicar o front-end no S3
        run: |
          cd web && npm ci && npm run build
          BUCKET="$(terraform -chdir=../infra/terraform output -raw bucket_estaticos)"
          aws s3 sync dist/assets "s3://$BUCKET/assets" --cache-control "public, max-age=31536000, immutable"
          aws s3 sync dist "s3://$BUCKET" --exclude "assets/*" --exclude index.html --cache-control "public, max-age=300"
          aws s3 cp dist/index.html "s3://$BUCKET/index.html" --cache-control "no-cache"
      - name: Teste de fumaça em produção
        run: SMOKE_SO_HTTP=1 ./scripts/smoke-test.sh "$(terraform -chdir=infra/terraform output -raw url_site)"
