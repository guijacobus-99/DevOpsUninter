# Gateway de borda local. Em produção esse papel é da CDN (cache curto, coalescência de
# requisições, servir conteúdo velho se a origem cair); aqui o nginx reproduz o mesmo
# comportamento para dar para testar localmente.
worker_processes auto;
pid /tmp/nginx.pid;

events {
  worker_connections 4096;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;

  client_body_temp_path /tmp/client_temp;
  proxy_temp_path /tmp/proxy_temp;
  fastcgi_temp_path /tmp/fastcgi_temp;
  uwsgi_temp_path /tmp/uwsgi_temp;
  scgi_temp_path /tmp/scgi_temp;

  sendfile on;
  tcp_nopush on;
  keepalive_timeout 30s;
  server_tokens off;

  gzip on;
  gzip_comp_level 5;
  gzip_min_length 256;
  gzip_types application/json text/css application/javascript image/svg+xml;

  log_format json escape=json
    '{"ts":"$time_iso8601","ip":"$remote_addr","metodo":"$request_method","uri":"$request_uri",'
    '"status":$status,"bytes":$body_bytes_sent,"duracao":$request_time,'
    '"cache":"$upstream_cache_status","upstream_duracao":"$upstream_response_time"}';
  access_log /dev/stdout json;
  error_log /dev/stderr warn;

  proxy_cache_path /var/cache/nginx/api levels=1:2 keys_zone=api:10m max_size=100m inactive=10m use_temp_path=off;
  limit_req_zone $binary_remote_addr zone=por_ip:10m rate=20r/s;
  limit_req_status 429;

  upstream api {
    server api:3000;
    keepalive 32;
  }

  server {
    listen 8080;
    root /usr/share/nginx/html;

    location /api/ {
      limit_req zone=por_ip burst=40 nodelay;

      proxy_pass http://api;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_connect_timeout 2s;
      proxy_read_timeout 5s;

      # Quanto tempo servir conteúdo velho vem dos cabeçalhos da origem
      # (stale-while-revalidate=30, stale-if-error=600). Não usar proxy_cache_use_stale aqui:
      # ele tem precedência sobre os cabeçalhos e permitiria servir dado velho sem limite de idade.
      proxy_cache api;
      proxy_cache_valid 200 5s;             # vale só se a origem não mandar Cache-Control
      proxy_cache_lock on;                  # 1 requisição por chave vai à origem; o resto espera
      proxy_cache_lock_timeout 2s;
      proxy_cache_revalidate on;            # revalida com If-None-Match (304)
      proxy_cache_background_update on;

      include /etc/nginx/cabecalhos-seguranca.conf;
      add_header X-Cache-Status $upstream_cache_status always;
    }

    location = /healthz {
      access_log off;
      default_type text/plain;
      return 200 "ok";
    }

    # Arquivos com hash no nome: cache "eterno" no navegador e na CDN.
    location /assets/ {
      include /etc/nginx/cabecalhos-seguranca.conf;
      add_header Cache-Control "public, max-age=31536000, immutable" always;
      try_files $uri =404;
    }

    location / {
      include /etc/nginx/cabecalhos-seguranca.conf;
      add_header Cache-Control "no-cache" always;
      try_files $uri /index.html;
    }
  }
}
