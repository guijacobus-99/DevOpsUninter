global:
  scrape_interval: 5s
  evaluation_interval: 5s

rule_files:
  - /etc/prometheus/alertas.yml

scrape_configs:
  - job_name: ingestor
    static_configs:
      - targets: ['ingestor:9100']

  # Descoberta por DNS: encontra todas as réplicas da API (docker compose --scale / deploy.replicas).
  - job_name: api
    dns_sd_configs:
      - names: ['api']
        type: A
        port: 3000
        refresh_interval: 15s
