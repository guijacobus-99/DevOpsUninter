global:
  scrape_interval: 5s
  evaluation_interval: 5s

rule_files:
  - /etc/prometheus/alertas.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ['alertmanager:9093']

# Descoberta por DNS: encontra todas as réplicas (docker compose deploy.replicas / --scale).
scrape_configs:
  - job_name: ingestor
    dns_sd_configs:
      - names: ['ingestor']
        type: A
        port: 9100
        refresh_interval: 15s

  - job_name: api
    dns_sd_configs:
      - names: ['api']
        type: A
        port: 3000
        refresh_interval: 15s
